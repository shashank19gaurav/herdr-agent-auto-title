id = "copilot-auto-title"
name = "Copilot Auto-Title"
version = "0.1.1"
min_herdr_version = "0.9.4"
description = "Auto-title local and saved SSH machine Copilot tabs from their active conversation."
platforms = ["windows"]

[[startup]]
command = ["node", "src/main.mjs", "start"]

[[events]]
on = "pane.agent_detected"
command = ["node", "src/main.mjs", "start"]

[[events]]
on = "tab.focused"
command = ["node", "src/main.mjs", "start"]

[[events]]
on = "workspace.created"
command = ["node", "src/main.mjs", "start"]

[[actions]]
id = "start"
title = "Start Copilot auto-title"
contexts = ["global"]
command = ["node", "src/main.mjs", "start"]

[[panes]]
id = "watcher"
title = "Copilot Auto-Title"
placement = "tab"
command = ["node", "src/main.mjs", "watch"]

id = "copilot-auto-title"
name = "Herdr Agent Auto-Title"
version = "0.2.0"
min_herdr_version = "0.9.4"
description = "Sync local and saved SSH machine Copilot and pi tab titles from their active session names."
platforms = ["windows"]

[[startup]]
command = ["node", "src/main.mjs", "start"]

[[events]]
on = "pane.agent_detected"
command = ["node", "src/main.mjs", "start"]

[[events]]
on = "tab.focused"
command = ["node", "src/main.mjs", "start"]

[[events]]
on = "workspace.created"
command = ["node", "src/main.mjs", "start"]

[[actions]]
id = "start"
title = "Start agent auto-title"
contexts = ["global"]
command = ["node", "src/main.mjs", "start"]

[[panes]]
id = "watcher"
title = "Herdr Agent Auto-Title"
placement = "tab"
command = ["node", "src/main.mjs", "watch"]
